apiVersion: maximilianopizarro.github.io/v1alpha1
kind: McpWorker
metadata:
  name: mcp-worker
spec:
  enabled: true
  instanceBaseName: demo
  replicas: 1
  port: 8083
  timeoutSeconds: 120
  image:
    repository: quay.io/maximilianopizarro/jhipster-online-mcp-worker
    tag: "2.41.1-mcp-worker"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
