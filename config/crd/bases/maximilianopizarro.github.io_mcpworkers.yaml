---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpworkers.maximilianopizarro.github.io
spec:
  group: maximilianopizarro.github.io
  names:
    kind: McpWorker
    listKind: McpWorkerList
    plural: mcpworkers
    singular: mcpworker
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: >-
          MCP HTTP worker (Node). Deploys Deployment + Service named like the main jhipster-online
          release plus "-mcp-worker". instanceBaseName must match the JhipsterOnline CR metadata.name
          in the same namespace.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
              - instanceBaseName
              - image
            properties:
              enabled:
                type: boolean
              instanceBaseName:
                type: string
                minLength: 1
              replicas:
                type: integer
                minimum: 0
              port:
                type: integer
                minimum: 1
                maximum: 65535
              timeoutSeconds:
                type: integer
                minimum: 1
              image:
                type: object
                required:
                  - repository
                  - tag
                properties:
                  repository:
                    type: string
                  tag:
                    type: string
                  pullPolicy:
                    type: string
                    enum: ["Always", "IfNotPresent", "Never"]
              imagePullSecrets:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
              resources:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              service:
                type: object
                properties:
                  type:
                    type: string
                    enum: ["ClusterIP", "NodePort", "LoadBalancer"]
              nodeSelector:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              tolerations:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              affinity:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              serviceAccountName:
                type: string
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
