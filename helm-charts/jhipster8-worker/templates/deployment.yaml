{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jhipster8-worker.operatorMainFullname" . }}-jhipster8-worker
  labels:
    app.kubernetes.io/name: jhipster-online
    app.kubernetes.io/instance: {{ .Values.instanceBaseName | default .Release.Name | quote }}
    app.kubernetes.io/component: jhipster8-worker
    app: jhipster-online
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jhipster-online
      app.kubernetes.io/instance: {{ .Values.instanceBaseName | default .Release.Name | quote }}
      app.kubernetes.io/component: jhipster8-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jhipster-online
        app.kubernetes.io/instance: {{ .Values.instanceBaseName | default .Release.Name | quote }}
        app.kubernetes.io/component: jhipster8-worker
        app: jhipster-online
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccountName | default "default" }}
      containers:
        - name: jhipster8-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
