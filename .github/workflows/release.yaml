name: Release

on:
  push:
    tags: ["v*"]

env:
  IMAGE_TAG_BASE: quay.io/maximilianopizarro/jhipster-online-operator

jobs:
  build-push:
    name: Build & push operator images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build & push operator image
        run: |
          docker build -t ${{ env.IMAGE_TAG_BASE }}:${{ github.ref_name }} .
          docker push ${{ env.IMAGE_TAG_BASE }}:${{ github.ref_name }}

      - name: Build & push bundle image
        run: |
          docker build -f bundle.Dockerfile \
            -t ${{ env.IMAGE_TAG_BASE }}-bundle:${{ github.ref_name }} .
          docker push ${{ env.IMAGE_TAG_BASE }}-bundle:${{ github.ref_name }}
